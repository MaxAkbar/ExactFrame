name: Build and test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
      - name: Restore pinned dependencies
        run: |
          dotnet restore ExactFrame.slnx -p:Platform=x64 --locked-mode
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet restore tests/ExactFrame.WindowsChecks/ExactFrame.WindowsChecks.csproj -p:Platform=x64 --locked-mode
      - name: Test Core
        run: dotnet test tests/ExactFrame.Core.Tests/ExactFrame.Core.Tests.csproj -c Release -p:Platform=x64 --no-restore --logger "trx;LogFileName=core.trx" --results-directory TestResults
      - name: Build Windows checks (interactive execution is separate)
        run: dotnet build tests/ExactFrame.WindowsChecks/ExactFrame.WindowsChecks.csproj -c Release -p:Platform=x64 --no-restore -p:ContinuousIntegrationBuild=true
      - name: Package x64 and ARM64
        run: ./scripts/Build-Release.ps1 -LockedRestore
      - name: Retain portable packages and checksums
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: portable-release
          path: |
            artifacts/release/*/*.zip
            artifacts/release/*/SHA256SUMS.txt
          if-no-files-found: error
      - name: Retain test report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: core-test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
